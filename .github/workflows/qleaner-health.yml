name: "Qleaner Health Guardian"

# Runs as the GitHub Actions check named after the job id below (default: "hygiene-check").
# Branch protection → Required status checks must list that exact name once this workflow has run on a PR.
# If a required check stays "Expected — Waiting for status to be reported", the workflow did not run
# (e.g. wrong base branch, draft PR awaiting approval for first-time contributors, or workflow file not on default branch).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 3. Install Local Dependencies
        run: yarn install

      - name: 4. Restore Qleaner Smart Cache
        # unused-check-cache.json: dependency graph, unused-file lists, image graph, parentGraph.fixes (surgical-pass fingerprints)
        uses: actions/cache@v4
        with:
          path: unused-check-cache.json
          key: qleaner-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/qleaner.config.json') }}
          restore-keys: |
            qleaner-cache-${{ runner.os }}-

      - name: 5. Tidy (dry-run), image scan, and summary (read-only)
        # Order: tidy (-r includes console-log dry-run with per-tier hit tables when foundByRisk exists) → image → summary.
        # No --auto-fix: surgical steps are dry-run only. No code commits. Job succeeds when every command exits 0.
        env:
          NO_COLOR: "1"
        run: |
          yarn start tidy src/infisical-main/frontend -r > tidy_report.txt 2>&1
          yarn start image src/infisical-main/frontend/public src/infisical-main/frontend -d -T 1 > image_report.txt 2>&1
          yarn start summary > health_summary.txt
          node .github/scripts/pr-report.js qleaner.stats.json health_summary.txt tidy_report.txt image_report.txt > pr_report.md

      - name: 6. Post PR Health Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_report.md')) { return; }

            const body = fs.readFileSync('pr_report.md', 'utf8');
            const marker = '<!-- qleaner-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
