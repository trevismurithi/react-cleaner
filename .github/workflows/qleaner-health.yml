name: "Qleaner Health Guardian"

on:
  pull_request:
    branches: [ main, master, develop, staging ]

jobs:
  hygiene-check:
    name: "Repository Hygiene and Stats"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 3. Install Local Dependencies
        run: yarn install

      - name: 4. Restore Qleaner Smart Cache
        # unused-check-cache.json: dependency graph, unused-file lists, image graph, parentGraph.fixes (surgical-pass fingerprints)
        uses: actions/cache@v4
        with:
          path: unused-check-cache.json
          key: qleaner-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/qleaner.config.json') }}
          restore-keys: |
            qleaner-cache-${{ runner.os }}-

      - name: 5. Tidy (dry-run), summary, and image scan (read-only)
        # tidy without --auto-fix: each step dry-runs only; stdout/stderr captured for the PR comment. No code commits.
        env:
          NO_COLOR: "1"
        run: |
          yarn start tidy src/infisical-main/frontend > tidy_report.txt 2>&1
          yarn start summary > health_summary.txt
          yarn start image src/infisical-main/public src/infisical-main --dry-run -t > image_report.txt 2>&1
          node .github/scripts/pr-report.js qleaner.stats.json health_summary.txt tidy_report.txt image_report.txt > pr_report.md

      - name: 6. Post PR Health Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_report.md')) { return; }

            const body = fs.readFileSync('pr_report.md', 'utf8');
            const marker = '<!-- qleaner-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
