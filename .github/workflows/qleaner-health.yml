name: "Qleaner Health Guardian (Local Mode)"

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # This caches your node_modules for faster subsequent runs

      - name: 3. Install Local Dependencies
        # Since it's not on NPM, we must install the project's own dependencies to run 'yarn start'
        run: yarn install

      - name: 4. Restore Qleaner Smart Cache
        # Restores unused-check-cache.json for incremental scans.
        uses: actions/cache@v4
        with:
          path: unused-check-cache.json
          key: qleaner-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            qleaner-cache-${{ runner.os }}-

      - name: 5. Execute Health Pipeline
        # We replace global 'qleaner' with your local 'yarn start' command
        # Using -d (dry-run) and -C (clear-cache) as requested
        run: |
          yarn start tidy
          yarn start summary --dependencies > health_summary.txt

      - name: 6. Analyze and Post PR Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Check if stats file exists before reading
            if (fs.existsSync('qleaner.stats.json')) {
              const stats = JSON.parse(fs.readFileSync('qleaner.stats.json', 'utf8'));
              const summary = fs.existsSync('health_summary.txt') ? fs.readFileSync('health_summary.txt', 'utf8') : 'No summary generated.';
              
              const sessions = Object.values(stats.fileAssociatedStats || {});
              const lastSession = sessions[sessions.length - 1] || {};
              
              const body = `### 🧹 Qleaner Local Health Report
              **Surgical Impact of this PR:**
              - **Items Removed:** ${lastSession.totalItemsRemoved || 0}
              - **Lines of Code (LOC) Pruned:** ${lastSession.totalLinesRemoved || 0}
              - **Storage Reclaimed:** ${lastSession.bytesSaved || 0} bytes
              
              **🚀 Estimated Developer Time Reclaimed: ${lastSession.estimatedDeveloperHoursSaved || 0} hrs**
              
              **Project Hotspots:**
              \`\`\`
              ${summary}
              \`\`\`
              
              *Running via local source (yarn start).*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }