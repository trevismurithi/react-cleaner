name: "Qleaner Health Guardian"

on:
  pull_request:
    branches: [ main, master, develop, staging ]

jobs:
  hygiene-check:
    name: "Repository Hygiene and Stats"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing code changes
      pull-requests: write # Required for posting PR comments

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          # We explicitly check out the branch to avoid 'detached HEAD' errors
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 3. Install Local Dependencies
        # Essential for running Qleaner from source via 'yarn start'
        run: yarn install

      - name: 4. Restore Qleaner Smart Cache
        # Uses unused-check-cache.json to ensure fast, incremental PR analysis
        uses: actions/cache@v4
        with:
          path: unused-check-cache.json
          key: qleaner-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            qleaner-cache-${{ runner.os }}-

      - name: 5. Execute Cleanup and Summary
        # Runs the full 'tidy' sequence and generates dependency hotspots
        run: |
          yarn start tidy
          yarn start summary > health_summary.txt
          node .github/scripts/pr-report.js qleaner.stats.json health_summary.txt > pr_report.md

      - name: 6. Commit and Push Cleaned Code
        # This saves the changes back to the PR branch correctly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          # Check if tidy actually changed any files in stats or code
          if ! git diff --cached --exit-code; then
            git commit -m "chore: automated qleaner repository hygiene"
            # Explicitly push to the PR branch to resolve detached HEAD issue
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No hygiene issues detected. Code is pristine."
          fi

      - name: 7. Post PR Health Report
        if: always() # Post report even if git push was skipped
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_report.md')) { return; }

            const body = fs.readFileSync('pr_report.md', 'utf8');
            const marker = '<!-- qleaner-report -->';

            // Find an existing comment from a previous push to this PR and update it
            // instead of creating a new one on every run.
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }