name: "Qleaner Health Guardian"

on:
  pull_request:
    branches: [ main, master, develop, staging ]

jobs:
  hygiene-check:
    name: "Repository Hygiene and Stats"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing code changes
      pull-requests: write # Required for posting PR comments

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          # We explicitly check out the branch to avoid 'detached HEAD' errors
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 3. Install Local Dependencies
        # Essential for running Qleaner from source via 'yarn start'
        run: yarn install

      - name: 4. Restore Qleaner Smart Cache
        # Uses unused-check-cache.json to ensure fast, incremental PR analysis
        uses: actions/cache@v4
        with:
          path: unused-check-cache.json
          key: qleaner-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            qleaner-cache-${{ runner.os }}-

      - name: 5. Execute Cleanup and Summary
        # Runs the full 'tidy' sequence and generates dependency hotspots
        run: |
          yarn start tidy
          yarn start summary > health_summary.txt

      - name: 6. Commit and Push Cleaned Code
        # This saves the changes back to the PR branch correctly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          # Check if tidy actually changed any files in stats or code
          if ! git diff --cached --exit-code; then
            git commit -m "chore: automated qleaner repository hygiene"
            # Explicitly push to the PR branch to resolve detached HEAD issue
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No hygiene issues detected. Code is pristine."
          fi

      - name: 7. Post PR Health Report
        if: always() # Post report even if git push was skipped
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (fs.existsSync('qleaner.stats.json')) {
              const stats = JSON.parse(fs.readFileSync('qleaner.stats.json', 'utf8'));
              const summaryText = fs.existsSync('health_summary.txt') ? fs.readFileSync('health_summary.txt', 'utf8') : 'Summary not available.';
              
              // Get the most recent surgical impact metrics
              const sessions = Object.values(stats.fileAssociatedStats || {});
              const lastSession = sessions[sessions.length - 1] || {};
              
              const body = `### 🧹 Qleaner Health Guardian Report
              **Surgical Fixes Applied:**
              - **Items Removed:** ${lastSession.totalItemsRemoved || 0}
              - **Lines Pruned:** ${lastSession.totalLinesRemoved || 0}
              - **Size Saved:** ${lastSession.bytesSaved || 0} bytes
              
              **🚀 Time Reclaimed: ${lastSession.estimatedDeveloperHoursSaved || 0} hrs**
              
              **Repository Hotspots:**
              \`\`\`
              ${summaryText}
              \`\`\`
              
              *Codebase health maintained by Qleaner v1.3.3.*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }